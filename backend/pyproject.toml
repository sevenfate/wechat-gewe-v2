[project]
name = "wechat-bot-platform"
version = "0.1.0"
description = "GeWe-based private WeChat bot management and agent platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uuid6>=2025.0.1,<2027",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_bot"]

[tool.hatch.build.targets.wheel.force-include]
"builtin_plugins" = "wechat_bot/builtin_plugins"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["wechat_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wechat_bot"]
