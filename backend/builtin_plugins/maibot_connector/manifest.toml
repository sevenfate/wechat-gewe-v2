id = "builtin.maibot-connector"
name = "MaiBot Connector"
version = "0.1.0"
core_api = "1"
entrypoint = "plugin:create_plugin"
description = "受 ACL、fencing、TTL 和 Outbox 约束的 MaiBot 1.2.3 文本桥接。"
events = ["gewe.message.text"]
capabilities = [
  "message.forward.external.maibot",
  "message.reply.text",
  "message.send.text",
  "message.send.proactive.maibot",
]
timeout_seconds = 5

[config_schema]
type = "object"
additionalProperties = false
required = ["websocket_url", "api_key", "client_uuid"]

[config_schema.properties.websocket_url]
type = "string"
minLength = 1

[config_schema.properties.api_key]
type = "string"
minLength = 1

[config_schema.properties.client_uuid]
type = "string"
minLength = 1
maxLength = 255

[config_schema.properties.message_ttl_seconds]
type = "integer"
minimum = 10
maximum = 3600

[config_schema.properties.max_pending_messages]
type = "integer"
minimum = 1
maximum = 10000

[config_schema.properties.ack_retry_seconds]
type = "number"
exclusiveMinimum = 0
maximum = 300

[config_schema.properties.reconnect_initial_seconds]
type = "number"
exclusiveMinimum = 0
maximum = 60

[config_schema.properties.reconnect_max_seconds]
type = "number"
exclusiveMinimum = 0
maximum = 300

[config_schema.properties.enable_proactive_messages]
type = "boolean"
